<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Screen Hub video</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
/* Frameless YouTube player for Screen Hub. Only used once GitHub Pages is switched on for
   this repo (YouTube plays more reliably from a proper web page). Reports end/error to the player. */
(function () {
  var q = {}, parts = location.search.replace(/^\?/, "").split("&"), i, kv;
  for (i = 0; i < parts.length; i++) { kv = parts[i].split("="); if (kv[0]) q[kv[0]] = decodeURIComponent(kv[1] || ""); }
  var v = String(q.v || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 11);
  if (!v) return;
  var start = parseInt(q.start, 10) || 0;
  var f = document.createElement("iframe");
  f.src = "https://www.youtube.com/embed/" + v + "?autoplay=1&controls=0&disablekb=1&fs=0&iv_load_policy=3&modestbranding=1&rel=0&playsinline=1&enablejsapi=1" +
    "&mute=" + (q.mute === "0" ? 0 : 1) + (start ? "&start=" + start : "") + "&origin=" + encodeURIComponent(location.protocol + "//" + location.host);
  f.setAttribute("allow", "autoplay; encrypted-media");
  document.body.appendChild(f);
  function listen() { try { f.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1, channel: "widget" }), "*"); } catch (e) {} }
  f.onload = function () { listen(); setTimeout(listen, 1500); };
  function tell(m) { try { parent.postMessage(m, "*"); } catch (e) {} }
  window.addEventListener("message", function (e) {
    if (e.source !== f.contentWindow) return;
    var d; try { d = typeof e.data === "string" ? JSON.parse(e.data) : e.data; } catch (x) { return; }
    if (!d) return;
    if (d.event === "onError") { tell("rs:error"); return; }
    var st = d.event === "onStateChange" ? d.info : (d.info && d.info.playerState);
    if (st === 0) tell("rs:ended");
  });
})();
</script>
</body>
</html>
